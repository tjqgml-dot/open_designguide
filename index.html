h+=note(i);if(admin)h+=makeEditor(i);h+='<footer><span>신규 오픈 가맹점 환경구성물 제작·설치 협업</span><span>'+String(i+1).padStart(2,'0')+' / 06</span></footer>';content.innerHTML=h;if(i===1)for(let k=0;k<DATA.spaces.length;k++){let b=await getMedia('pdf-'+k);let status=document.getElementById('pdfstatus'+k),name=document.getElementById('pdfname'+k),btn=document.getElementById('pdfbtn'+k);if(status){status.textContent=b?'첨부 완료':'미첨부';status.classList.toggle('ready',!!b);name.textContent=b?(b.name||'등록된 PDF'):'등록된 자료가 없습니다.';btn.disabled=!b}}if(i===2){const z=await getMedia('zoning-pdf');const zb=document.getElementById('zoningPdfBtn');if(zb){zb.disabled=!z;zb.title=z?(z.name||'확정 조닝안 PDF 보기'):'관리자 모드에서 확정 조닝안 PDF를 첨부해 주세요';}const zn=document.getElementById('zoningPdfName');if(zn)zn.textContent=z?'현재 첨부: '+(z.name||'확정 조닝안 PDF'):'현재 첨부된 PDF가 없습니다.';}if(i===3)for(let k=0;k<DATA.issues.length;k++)await updateImage(k);window.scrollTo(0,0)}
function showStep(i){document.getElementById('modal').className='modal';activeStep=i;const a=DATA.step[i];document.getElementById('modal').innerHTML='<button class="closex" onclick="closeModal()" aria-label="닫기">×</button><div class="tag">협업 프로세스 · 단계 '+(i+1)+' / '+DATA.step.length+'</div><h2>'+esc(a[0])+'</h2><ul>'+a.slice(1).map(v=>'<li>'+nl(v)+'</li>').join('')+'</ul><div class="modalbuttons"><button onclick="'+(i>0?'showStep('+(i-1)+')':'closeModal()')+'">'+(i>0?'이전 단계':'닫기')+'</button><div class="right"><button onclick="closeModal()">닫기</button><button class="primary" onclick="'+(i===DATA.step.length-1?'closeModal()':'showStep('+(i+1)+')')+'">'+(i===DATA.step.length-1?'완료':'다음 단계 →')+'</button></div></div>';overlay.classList.add('open')}
function showDate(i){document.getElementById('modal').className='modal';let a=DATA.dates[i];document.getElementById('modal').innerHTML='<button class="closex" onclick="closeModal()" aria-label="닫기">×</button><div class="tag">'+esc(a[0])+'</div><h2>'+esc(a[1])+'</h2><ul>'+a[2].map(v=>'<li>'+nl(v)+'</li>').join('')+'</ul><div class="modalbuttons"><button onclick="closeModal()">닫기</button></div>';overlay.classList.add('open')};function showImage(i){document.getElementById('modal').className='modal';const u=mediaUrl['issue-'+i];if(!u)return;document.getElementById('modal').innerHTML='<button class="closex" onclick="closeModal()" aria-label="닫기">×</button><h2>'+esc(DATA.issues[i][0])+' · 예시 이미지</h2><img class="previewImage" src="'+u+'" alt="'+esc(DATA.issues[i][0])+' 예시"><div class="modalbuttons"><button onclick="closeModal()">닫기</button></div>';overlay.classList.add('open')};function closeModal(){overlay.classList.remove('open')}overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
async function openZoningPdf(){const blob=await getMedia('zoning-pdf');if(!blob){alert('확정 조닝안 PDF가 아직 첨부되지 않았습니다. 관리자 모드에서 등록해 주세요.');return;}const url=await urlMedia('zoning-pdf');const modal=document.getElementById('modal');modal.className='modal pdfmodal';modal.innerHTML='<button class="closex" onclick="closeModal()" aria-label="닫기">×</button><h2> D-20 · 확정 조닝안 PDF</h2><iframe title="확정 조닝안 PDF 미리보기" src="'+url+'#toolbar=1"></iframe><div class="modalbuttons"><span class="small">PDF가 표시되지 않으면 새 창에서 열어 확인해 주세요.</span><div class="right"><button onclick="openZoningPdfNewTab()">새 창에서 보기</button><button class="primary" onclick="closeModal()">닫기</button></div></div>';overlay.classList.add('open')}async function openZoningPdfNewTab(){const url=mediaUrl['zoning-pdf']||await urlMedia('zoning-pdf');if(url)window.open(url,'_blank','noopener')}async function updateImage(k){const target=document.getElementById('issueImage'+k);if(!target)return;let u=await urlMedia('issue-'+k);if(u){target.outerHTML='<img class="example" id="issueImage'+k+'" src="'+u+'" alt="'+esc(DATA.issues[k][0])+' 예시" onclick="showImage('+k+')" title="클릭하면 크게 볼 수 있습니다">'}}async function uploadFile(key,files,kind){if(!admin){alert('관리자 모드에서만 첨부할 수 있습니다.');return}const f=files?.[0];if(!f)return;if(kind==='pdf'&&f.type!=='application/pdf')return alert('PDF 파일만 첨부할 수 있습니다.');if(kind==='image'&&!['image/png','image/jpeg','image/webp','image/gif'].includes(f.type))return alert('PNG, JPG, WEBP, GIF 이미지만 첨부할 수 있습니다.');if(f.size>20*1024*1024)return alert('첨부 파일은 20MB 이하로 등록해 주세요.');await putMedia(key,f);await go(current);alert('첨부파일을 저장했습니다. 다른 PC에 전달하려면 전체 백업 파일을 내보내세요.')}async function removeMedia(key){if(!admin)return;if(!confirm('첨부파일을 삭제할까요?'))return;await delMedia(key);if(mediaUrl[key])URL.revokeObjectURL(mediaUrl[key]);delete mediaUrl[key];await go(current)}async function openPdf(i){let blob=await getMedia('pdf-'+i);if(!blob)return;let url=await urlMedia('pdf-'+i);window.open(url,'_blank')}
function toggleAdmin(){return;admin=!admin;document.getElementById('adminToggle').textContent=admin?'관리자 모드 종료':'관리자 모드 켜기';document.getElementById('adminTools').hidden=!admin;go(current)}function field(label,name,value,multiline=false){return '<div class="field"><label>'+esc(label)+'</label>'+(multiline?'<textarea data-path="'+esc(name)+'">'+esc(value)+'</textarea>':'<input data-path="'+esc(name)+'" value="'+esc(value)+'">')+'</div>'}function makeEditor(i){let h='<section class="editor" id="editor"><h2>페이지 내용 편집</h2><p class="small">수정 후 저장을 누르면 이 브라우저에 유지됩니다. 다른 PC에 공유하려면 좌측의 전체 내보내기를 사용하세요.</p>';h+=field('페이지 제목','titles.'+i,DATA.titles[i])+field('페이지 안내 문구','descriptions.'+i,DATA.descriptions[i],true)+field('하단 강조 문구','notes.'+i,DATA.notes[i],true);let typ=['step','spaces','dates','issues','qc','flow'][i],arr=DATA[typ];arr.forEach((a,k)=>{h+='<div class="editgroup"><h3>항목 '+(k+1)+'</h3>';if(typeof a==='string'){h+=field('공간명',typ+'.'+k,a)}else if(typ==='step'){h+=field('단계 제목',typ+'.'+k+'.0',a[0]);for(let j=1;j<a.length;j++)h+=field('상세 내용 '+j,typ+'.'+k+'.'+j,a[j],true)}else if(typ==='dates'){h+=field('일정',typ+'.'+k+'.0',a[0])+field('주요 업무',typ+'.'+k+'.1',a[1]);for(let j=0;j<a[2].length;j++)h+=field('세부 내용 '+(j+1),typ+'.'+k+'.2.'+j,a[2][j],true)}else{for(let j=0;j<a.length;j++)h+=field(['항목명','사례·설명','대응 기준'][j]||'내용',typ+'.'+k+'.'+j,a[j],j>0)}h+='</div>'});h+='<div class="editoractions"><button class="btn" onclick="saveEditor()">수정 내용 저장</button><button class="btn secondary" onclick="resetPage()">현재 페이지 문안 초기화</button></div></section>';return h}function saveEditor(){document.querySelectorAll('#editor [data-path]').forEach(e=>{let path=e.dataset.path.split('.'),o=DATA;for(let j=0;j<path.length-1;j++)o=o[path[j]];o[path.at(-1)]=e.value});saveData();go(current);alert('현재 페이지 수정 내용을 저장했습니다.')}function resetPage(){if(!confirm('현재 페이지 문안을 처음 상태로 되돌릴까요? 첨부파일은 유지됩니다.'))return;let typ=['step','spaces','dates','issues','qc','flow'][current];DATA.titles[current]=DEFAULT_DATA.titles[current];DATA.descriptions[current]=DESCRIPTIONS[current];DATA.notes[current]=['','PDF는 등록한 브라우저에 보관됩니다. 다른 PC로 공유하려면 관리자 모드에서 첨부파일을 포함한 백업 파일을 내보내 가져오세요.','D-20 조닝안 확정 즉시 CMPAS실을 통해 점주 확인을 요청하며, 3~5일 이내 회신 후 D-15까지 발주하는 것을 목표로 합니다.','시설물 훼손은 SI 협력업체를 통해 복구하고, 에스티애드컴 귀책 시 인건비·자재비 등 복구 비용을 에스티애드컴이 부담하는 조건으로 협의합니다. 그랜드오픈 전 보완 완료를 원칙으로 합니다.','필수 제출: 공간별 완료 사진 / 품질 점검표 / 현장 특이사항 및 보완 내역 / 조치 예정일·완료 결과','견적: 품목별 제작 단가, 설치 인건비, 배송·출장비, 비표준 추가 작업비. 계약 검토: 일정, 품질, 보완, 시설물 훼손, 추가 비용 사전 승인, 다비전 직접 청구.'][current];DATA[typ]=JSON.parse(JSON.stringify(DEFAULT_DATA[typ]));saveData();go(current)}
function fileToBase64(blob){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob)})}async function exportBackup(){if(!admin)return;const media={};for(const k of await keysMedia()){let b=await getMedia(k);media[k]={name:b.name||k,type:b.type,data:await fileToBase64(b)}}const out=new Blob([JSON.stringify({version:2,data:DATA,media},null,2)],{type:'application/json'});const u=URL.createObjectURL(out),a=document.createElement('a');a.href=u;a.download='환경구성물_협업자료_전체백업.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function importBackup(files){if(!admin)return;let f=files?.[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(obj.version!==2||!obj.data||!Array.isArray(obj.data.titles)||obj.data.titles.length!==6)throw Error('백업 형식이 올바르지 않습니다.');if(!confirm('현재 수정 내용과 첨부파일을 백업 내용으로 덮어쓸까요?'))return;const all=await keysMedia();for(const k of all)await delMedia(k);for(const [k,v] of Object.entries(obj.media||{})){let res=await fetch(v.data);let blob=await res.blob();await putMedia(k,new File([blob],v.name||k,{type:v.type||blob.type}))}DATA=obj.data;ensureHearingCorner();saveData();await go(current);alert('내용과 첨부파일을 불러왔습니다.')}catch(e){alert('불러오기 실패: '+e.message)}finally{document.getElementById('backupInput').value=''}}go(0);
</script></body></html>
